name: Build Android APK for Darse Islami

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Dependencies
      run: |
        npm install
        npm install @capacitor/core @capacitor/cli @capacitor/android admob-plus-cordova

    - name: Sync Capacitor
      run: |
        npx cap add android
        npx cap sync

    - name: Build Android Release APK
      run: |
        cd android
        ./gradlew assembleRelease

    - name: Upload APK Package
      uses: actions/upload-artifact@v4
      with:
        name: Darse-Islami-Update-APK
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk
        
