name: Build Android AAB for Darse Islami

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Dependencies
      run: |
        npm install
        npm install @capacitor/core @capacitor/cli @capacitor/android admob-plus-cordova

    - name: Sync Capacitor
      run: |
        npx cap add android
        npx cap sync

    - name: Build Android Release AAB
      run: |
        cd android
        ./gradlew bundleRelease

    - name: Upload AAB Package
      uses: actions/upload-artifact@v3
      with:
        name: Darse-Islami-Update-AAB
        path: android/app/build/outputs/bundle/release/app-release.aab
        
